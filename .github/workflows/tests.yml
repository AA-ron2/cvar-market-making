name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            pyproject.toml

      - name: Install (the lock's versions, CPU torch)
        run: |
          python -m pip install --upgrade pip
          # 1. CPU torch at the lock's version (the thesis ran the CUDA build of the same version)
          TORCH_VERSION=$(grep -E '^torch==' requirements-lock.txt | cut -d= -f3 | cut -d+ -f1)
          python -m pip install "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          # 2. The lock without its torch and CUDA lines, as constraints
          grep -v -E '^(torch|torchvision|torchaudio|triton)==|^nvidia-' requirements-lock.txt > constraints.txt
          # 3. The package with the test extra
          python -m pip install -c constraints.txt -e ".[test]"

      - name: Tests (tests/)
        run: python -m pytest -q -rs tests

      - name: Tests (hummingbot_adapter/tests)
        run: python -m pytest -q -rs hummingbot_adapter/tests
